<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | APNA CA</title>
  <style>
    body { background: #f9fafb; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #who { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 360px; text-align: center; }
    p { color: #111; font-weight: bold; font-size: 22px; }
    .ele { margin: 12px 0; }
    #btn { margin-top: 15px; background: #3b82f6; border: none; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="who">
    <p>Who are you?</p>
    <div class="ele"><label><input type="radio" name="identity" value="startup"> Startup / Organization</label></div>
    <div class="ele"><label><input type="radio" name="identity" value="self"> Self-finance</label></div>
    <button id="btn">Next</button>
  </div>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      const selected = document.querySelector('input[name="identity"]:checked');
      if (selected) {
        localStorage.setItem('userType', selected.value);
        window.location.href = '/profession';
      } else {
        alert('Please select one option before proceeding!');
      }
    });
  </script>
</body>
</html>
